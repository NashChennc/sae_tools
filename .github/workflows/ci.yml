name: CI Workflow

# 触发条件：推送到 main 分支，或针对 main 分支发起 PR
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,workflow,tui]"

    - name: Run Pytest
      env:
        PYTHONPATH: src
      run: |
        python -m pytest

    - name: Run Smoke Checks
      env:
        PYTHONPATH: src
      run: |
        python -m sae_tools_tui --help
        python -m sae_tools.reporting --help

    - name: Validate Registry and Snakemake
      run: |
        python scripts/inspect_registry.py --strict
        snakemake -n